title: Kubernetes Icons
source: "[kubernetes/community `icons/svg`](https://github.com/kubernetes/community/tree/main/icons/svg) plus the Kubernetes, Argo CD, Helm, K3s and K3OS logos"

# `uv run build.py --import` downloads every url below and writes it to src/<into>, after the
# entry's edits (fill, viewBox, replace). `names` expands one entry per name: a list, or a map
# of name -> src, filling {name} and {src} in `url` and `into`.
downloaded: "2026-11-15"
import:
  - url: https://github.com/kubernetes/community/archive/c8b1af836bc44adbafe45653ceb1a4a54ab14d9a.zip
    path: "community-*/icons"
    into: kubernetes
  - url: https://raw.githubusercontent.com/cncf/artwork/main/projects/{name}/icon/color/{name}-icon-color.svg
    into: "cncf/{name}.svg"
    note: "argo is Argo CD"
    names: ["argo", "helm", "k3s", "kubernetes"]

# Hand-made files in src/ (not imported); `files` is a glob, the first match wins.
sources:
  - files: "other/k3os.svg"
    note: "moved from the techno pack (originally from techno's svg.zip); CNCF has no K3OS artwork"

# File name (without size suffix) -> label. kubernetes/community names files by kubectl short name.
labels:
  argo: Argo CD
  k3os: K3OS
  api: API Server
  c-c-m: Cloud Controller Manager
  c-m: Controller Manager
  k-proxy: Kube Proxy
  kubelet: Kubelet
  sched: Scheduler
  control-plane: Control Plane
  etcd: etcd
  node: Node
  c-role: ClusterRole
  cm: ConfigMap
  crb: ClusterRoleBinding
  crd: CustomResourceDefinition
  cronjob: CronJob
  deploy: Deployment
  ds: DaemonSet
  ep: Endpoints
  group: Group
  hpa: HorizontalPodAutoscaler
  ing: Ingress
  job: Job
  limits: LimitRange
  netpol: NetworkPolicy
  ns: Namespace
  pod: Pod
  psp: PodSecurityPolicy
  pv: PersistentVolume
  pvc: PersistentVolumeClaim
  quota: ResourceQuota
  rb: RoleBinding
  role: Role
  rs: ReplicaSet
  sa: ServiceAccount
  sc: StorageClass
  secret: Secret
  sts: StatefulSet
  svc: Service
  user: User
  vol: Volume

# Shown in README.md, in this order.
samples:
  - Kubernetes
  - Helm
  - Argo CD
  - Pod
  - Deployment
  - ReplicaSet
  - StatefulSet
  - DaemonSet
  - Job
  - CronJob
  - Service
  - Ingress
  - NetworkPolicy
  - ConfigMap
  - Secret
  - PersistentVolume
  - PersistentVolumeClaim
  - StorageClass
  - Namespace
  - ServiceAccount
  - Role
  - RoleBinding
  - HorizontalPodAutoscaler
  - Node
  - Control Plane
  - API Server
  - etcd
