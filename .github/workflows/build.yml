name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Test
        run: uv run pytest

      - name: Type-check
        run: uv run pyright

      - name: Build every pack
        run: uv run runax-icons build

      - name: Check packs
        run: uv run runax-icons check

      - name: Check generated READMEs are committed
        run: git diff --exit-code -- '*/README.md'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes */runax-*.excalidrawlib */runax-*.excalidraw
