name: build

# Builds and checks the packs. Runs when a pack or the code that builds it changes; tag pushes
# always run (GitHub ignores path filters for tags) and publish the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "*/pack.yml"
      - "*/src/**"
      - "*/README.md"
      - "runax_icons/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "*/pack.yml"
      - "*/src/**"
      - "*/README.md"
      - "runax_icons/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build.yml"

permissions:
  contents: write  # create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build every pack
        run: uv run runax-icons build

      - name: Check packs
        run: uv run runax-icons check

      - name: Check publishable packs against the libraries.excalidraw.com guidelines
        run: uv run runax-icons guidelines --publishable

      - name: Check generated READMEs are committed
        run: git diff --exit-code -- '*/README.md'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes */runax-*.excalidrawlib */runax-*.excalidraw NOTICE.md LICENSE LICENSES/*
