name: release

# Pack releases: a `<pack>/vX.Y.Z` tag publishes that pack's libraries, scene and index entry,
# with the notes of its CHANGELOG.md section `## [X.Y.Z]`. Then the `index` release is refreshed
# with index.json and llms.txt for the latest release of every pack: what agents download.
# A `vX.Y.Z` tag releases the runax-icons command line (no assets). Running the workflow by hand
# only refreshes the index.
on:
  push:
    tags: ["v*", "*/v*"]
  workflow_dispatch:

permissions: {}  # each job asks for what it needs

jobs:
  pack:
    if: github.event_name == 'push' && contains(github.ref_name, '/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create releases and upload their assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes with git

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false  # what's published is built from scratch, never from a cache

      - name: Check the pack
        env:
          TAG: ${{ github.ref_name }}
        run: uv run runax-icons check "${TAG%%/*}"

      - name: Build the release assets
        env:
          TAG: ${{ github.ref_name }}
        run: uv run runax-icons release "$TAG" --out dist --notes notes.md

      # A release made in the GitHub UI (which creates the tag) already exists: attach the assets
      # to it, keeping its notes unless it has none.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(dist/* NOTICE.md LICENSE LICENSES/*)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest=false "${assets[@]}"
          fi

  index:
    needs: pack
    if: always() && (needs.pack.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create releases and upload their assets
    # No `concurrency:` lock: GitHub cancels queued runs of a group, and a cancelled job marks the
    # tagged commit failed. Refreshes run in parallel instead, and each checks after uploading
    # that no release appeared meanwhile (else it may have overwritten a newer index), so the
    # last one to finish lists every release.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes with git

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false  # what's published is built from scratch, never from a cache

      - name: Publish index.json and llms.txt
        run: |
          # Plain X.Y.Z pack releases; pre-releases aren't indexed.
          releases() {
            gh release list --limit 1000 --json tagName --jq '.[].tagName' \
              | grep -E '^[a-z0-9-]+/v[0-9]+\.[0-9]+\.[0-9]+$' | sort || true
          }
          gh release view index > /dev/null 2>&1 \
            || gh release create index --title "Index" --latest=false \
                 --notes "index.json and llms.txt: the latest release of every pack, for agents."

          for attempt in 1 2 3 4 5 6; do
            seen=$(releases)
            complete=true
            rm -rf entries index && mkdir entries
            for config in */pack.yml; do
              pack="${config%/pack.yml}"
              tag=$(grep "^$pack/v" <<< "$seen" | sort -V | tail -n 1 || true)
              if [ -n "$tag" ] && ! gh release download "$tag" --pattern "runax-$pack.json" --dir entries; then
                complete=false  # its assets are still uploading
              fi
            done
            uv run runax-icons index entries --repo "$GITHUB_REPOSITORY" --out index
            gh release upload index index/* --clobber

            sleep 15  # let releases other runs are publishing show up
            if $complete && [ "$(releases)" = "$seen" ]; then
              exit 0
            fi
            echo "Releases changed while indexing; indexing again."
          done
          echo "::warning::A release has no runax-<pack>.json entry; the index leaves it out."

  tool:
    if: github.event_name == 'push' && !contains(github.ref_name, '/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create releases and upload their assets
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
