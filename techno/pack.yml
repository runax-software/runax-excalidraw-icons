    into: "CSS.svg"
    note: "CC0-1.0; the current CSS logo"
  - url: https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/elixir.svg
    into: "Elixir.svg"
    fill: "#8847B9"
    note: "CC0-1.0; brand color"
