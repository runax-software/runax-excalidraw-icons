title: Technology Logos
source: "hand-picked technology logos from [gilbarbara/logos](https://github.com/gilbarbara/logos) and [simple-icons](https://github.com/simple-icons/simple-icons)"
license: "The logos come from [gilbarbara/logos](https://github.com/gilbarbara/logos) and [simple-icons](https://github.com/simple-icons/simple-icons) (both CC0-1.0); GitHub Codespaces is from [Primer Octicons](https://github.com/primer/octicons) (MIT). Product names and logos are trademarks of their owners and are used here only to refer to their products; no endorsement is implied."
# Operations the icons' terms rule out; the build refuses them.
forbid:
  native: "redrawing changes the logos' shape; the logos are their owners' trademarks"
  publish: "the logos are their owners' trademarks; we don't republish them as a library of their own"


# `uv run runax-icons import` downloads every url below and writes it to src/<into>, after the
# entry's edits (fill, viewBox, replace). `names` expands one entry per name: a list, or a map
# of name -> src, filling {name} and {src} in `url` and `into`.
downloaded: "2026-11-15"
import:
  - url: https://raw.githubusercontent.com/gilbarbara/logos/main/logos/{src}.svg
    into: "{name}.svg"
    note: "CC0-1.0"
    names:
      "Angular": "angular-icon"
      "Ansible": "ansible"
      "Astro": "astro-icon"
      "Bash": "bash-icon"
      "Bitbucket": "bitbucket"
      "Bun": "bun"
