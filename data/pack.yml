title: Data
source: "database, streaming and data-pipeline logos"
license: "Logos come from the projects themselves, [gilbarbara/logos](https://github.com/gilbarbara/logos) (CC0-1.0) and [simple-icons](https://github.com/simple-icons/simple-icons) (CC0-1.0). Product names and logos are trademarks of their owners and are used here only to refer to their products; no endorsement is implied."
# Operations the icons' terms rule out; the build refuses them.
forbid:
  native: redrawing changes the logos' shape; the logos are their owners' trademarks
  publish: the logos are their owners' trademarks; we don't republish them as a library of their own

# `uv run runax-icons import` downloads every url below and writes it to src/<into>, after the
# entry's edits (fill, viewBox, replace). `names` expands one entry per name: a list, or a map
# of name -> src, filling {name} and {src} in `url` and `into`.
downloaded: "2026-11-15"
import:
  - url: https://raw.githubusercontent.com/gilbarbara/logos/main/logos/{src}.svg
    into: "{name}.svg"
    note: "CC0-1.0"
    names:
      "Airbyte": "airbyte-icon"
      "Apache-Flink": "apache-flink-icon"
      "dbt": "dbt-icon"
      "NATS": "nats-icon"
      "OpenSearch": "opensearch-icon"
      "Qdrant": "qdrant-icon"
      "Snowflake": "snowflake-icon"
      "Valkey": "valkey-icon"
  - url: https://raw.githubusercontent.com/ClickHouse/ClickHouse/master/docker/server/README.src/logo.svg
    into: "ClickHouse.svg"
  - url: https://raw.githubusercontent.com/duckdb/duckdb-web/main/images/designmanual/DuckDB_icon-lightmode.svg
    into: "DuckDB.svg"
    note: "the icon from DuckDB's design manual"
  - url: https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/neo4j.svg
    into: "Neo4j.svg"
    fill: "#4581C3"
    note: "CC0-1.0; Neo4j brand color (the neo4j-browser icon is GPL-3.0)"
  - url: https://raw.githubusercontent.com/apache/iceberg/main/site/docs/assets/images/iceberg-logo-icon.png
    into: "Apache-Iceberg.svg"
    note: "PNG wrapped in SVG"
  - url: https://seatunnel.apache.org/image/logo.png
    into: "Apache-SeaTunnel.svg"
    note: "PNG wrapped in SVG"
  - url: https://raw.githubusercontent.com/apache/activemq-website/main/src/assets/img/activemq_logo_icon.svg
    into: "Apache-ActiveMQ.svg"
    viewBox: "10.8 10.4 30 44"
  - url: https://raw.githubusercontent.com/mqtt/mqtt.org/master/assets/img/mqtt-ver.svg
    into: "MQTT.svg"
    note: "official logo, unmodified (mqtt.org has no symbol-only version)"
  - url: https://user-images.githubusercontent.com/95200/143832033-32e868df-f3b0-4251-97fb-c64809a43d36.png
    into: "BullMQ.svg"
    note: "the taskforcesh/bullmq README banner, unmodified (BullMQ has no other logo file)"
  - url: https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/cockroachlabs.svg
    into: "CockroachDB.svg"
    fill: "#6933FF"
    note: "Cockroach Labs brand color"

# Hand-made files in src/ (not imported); `files` is a glob, the first match wins.
sources:
  - files: "*"
    note: "moved from the techno pack (originally from techno's svg.zip); Cosmos-DB, Elasticsearch and PostgreSQL renamed to fix typos"

# File name (without size suffix) -> label.
labels:
  dbt: dbt

# Shown in README.md, in this order.
samples:
  - PostgreSQL
  - MySQL
  - Microsoft SQL Server
  - SQLite
  - ClickHouse
  - DuckDB
  - CockroachDB
  - Snowflake
  - MongoDB
  - Redis
  - Valkey
  - Neo4j
  - Apache Kafka
  - RabbitMQ
  - NATS
  - MQTT
  - Apache ActiveMQ
  - BullMQ
  - Apache Flink
  - Apache Spark
  - Apache Airflow
  - Apache Iceberg
  - Airbyte
  - Apache SeaTunnel
  - dbt
  - Qdrant
  - OpenSearch
