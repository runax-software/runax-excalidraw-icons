title: Networking
source: "service mesh, ingress, CNI, DNS, VPN and API protocol logos: CNCF projects from [cncf/artwork](https://github.com/cncf/artwork) plus NGINX, Traefik, Kong, HAProxy, Caddy, Calico, Consul, Tailscale, WireGuard, NetBird, GraphQL, REST, OpenAPI, Swagger and Socket.IO"
license: "The CNCF project logos are from [cncf/artwork](https://github.com/cncf/artwork), used under the [Linux Foundation trademark guidelines](https://www.linuxfoundation.org/legal/trademark-usage); other logos come from [gilbarbara/logos](https://github.com/gilbarbara/logos) (CC0-1.0), [simple-icons](https://github.com/simple-icons/simple-icons) (CC0-1.0) or the projects themselves. Product names and logos are trademarks of their owners and are used here only to refer to their products; no endorsement is implied. \"WireGuard\" and the \"WireGuard\" logo are registered trademarks of Jason A. Donenfeld."
# Operations the icons' terms rule out; the build refuses them.
forbid:
  publish: the logos are their owners' trademarks; we don't republish them as a library of their own

# `uv run runax-icons import` downloads every url below and writes it to src/<into>, after the
# entry's edits (fill, viewBox, replace). `names` expands one entry per name: a list, or a map
# of name -> src, filling {name} and {src} in `url` and `into`.
downloaded: "2026-11-15"
import:
  - url: https://raw.githubusercontent.com/cncf/artwork/main/projects/{name}/icon/color/{name}-icon-color.svg
    into: "cncf/{name}.svg"
    names: ["antrea", "cert-manager", "cni", "contour", "coredns", "emissary-ingress", "envoy", "istio", "kgateway", "kube-ovn", "kuma", "linkerd", "metallb", "networkservicemesh", "spiffe", "spire", "submariner"]
  - url: https://raw.githubusercontent.com/cncf/artwork/main/projects/cilium/icon/color/cilium_icon-color.svg
    into: "cncf/cilium.svg"
  - url: https://raw.githubusercontent.com/cncf/artwork/main/projects/kmesh/icon/color/KMESH-icon-color.svg
    into: "cncf/kmesh.svg"
  - url: https://raw.githubusercontent.com/cncf/artwork/main/projects/grpc/pancake/color/grpc-pancake-color.svg
    into: "cncf/grpc.svg"
    note: "the gRPC mascot; its icon/ file is the wordmark"
  - url: https://raw.githubusercontent.com/gilbarbara/logos/main/logos/{src}.svg
    into: "other/{name}.svg"
    note: "CC0-1.0"
    names:
      "nginx": "nginx"
      "kong": "kong-icon"
      "traefik": "traefik-proxy-icon"
      "tailscale": "tailscale"
      "consul": "consul"
  - url: https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/haproxy.svg
    into: "other/haproxy.svg"
    fill: "#169BD6"
    note: "HAProxy brand color"
  - url: https://caddyserver.com/resources/images/favicon.png
    into: "other/caddy.svg"
    note: "Caddy's own symbol (its site icon)"
  - url: https://docs.tigera.io/img/calico-logo-2026-badge.png
    into: "other/calico.svg"
    note: "Calico's badge, from its docs"
  - url: https://www.wireguard.com/img/wireguard.svg
    into: "other/wireguard.svg"
    forbid:
      edit: "WireGuard's trademark policy forbids altering its logo in any way"
    note: "official logo, unmodified: WireGuard's trademark policy forbids removing elements"
  - url: https://raw.githubusercontent.com/netbirdio/netbird/main/client/ui/frontend/src/assets/logos/netbird.svg
    into: "other/netbird.svg"
  - url: https://raw.githubusercontent.com/gilbarbara/logos/main/logos/{src}.svg
    into: "other/{name}.svg"
    note: "CC0-1.0"
    names:
      "graphql": "graphql"
      "openapi": "openapi-icon"
      "socket.io": "socket.io"
      "swagger": "swagger"

# Hand-made files in src/ (not imported); `files` is a glob, the first match wins.
sources:
  - files: "other/rest.svg"
    note: "drawn for this pack; REST has no logo"

# File name -> label.
labels:
  antrea: Antrea
  cert-manager: cert-manager
  cni: CNI
  consul: HashiCorp Consul
  coredns: CoreDNS
  emissary-ingress: Emissary-ingress
  graphql: GraphQL
  grpc: gRPC
  haproxy: HAProxy
  kgateway: kgateway
  kube-ovn: Kube-OVN
  metallb: MetalLB
  netbird: NetBird
  networkservicemesh: Network Service Mesh
  nginx: NGINX
  openapi: OpenAPI
  rest: REST API
  socket.io: Socket.IO
  spiffe: SPIFFE
  spire: SPIRE
  wireguard: WireGuard

